<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Markdown in HTML Example</title>
    <!-- 1. Import the script module -->
    <script type="module" src="https://md-block.verou.me/md-block.js"></script>
</head>
<body>

    <!-- 2. Write your Markdown natively inside this tag -->
    <md-block>
        # This is an H1 Heading
        You can write **bold text** or *italics* easily.

        * Bullet point one
        * Bullet point two

        ```javascript
        console.log("Code blocks work too!");
        ```
    </md-block>

</body>
</html>
